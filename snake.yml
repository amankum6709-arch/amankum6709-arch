name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate contribution snake

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: amankum6709-arch
          outputs: |
            github-snake/github-snake.svg?color_snake=#ff6b35&color_dots=#0f172a,#164e63,#0e7490,#22d3ee,#67e8f9
            github-snake/github-snake-dark.svg?palette=github-dark&color_snake=#ff6b35&color_dots=#111827,#164e63,#0e7490,#22d3ee,#67e8f9

      - name: Commit generated snake
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add github-snake/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update contribution snake"
            git push
          fi
